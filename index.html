<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#f7f8fa;color:#1e293b;min-height:100vh}
.page{max-width:1380px;margin:0 auto;padding:28px 24px 60px}

/* Header */
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #e2e8f0}
.report-title h1{font-size:1.45rem;font-weight:700;color:#1e293b}
.report-title p{font-size:.82rem;color:#64748b;margin-top:2px}
.report-badge{background:#4f46e5;color:#fff;font-size:.78rem;font-weight:600;padding:6px 14px;border-radius:20px;letter-spacing:.03em}

/* Section titles */
.section-title{font-size:1rem;font-weight:600;color:#1e293b;margin-bottom:14px;margin-top:32px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:block;width:4px;height:18px;background:#4f46e5;border-radius:2px}

/* Cards */
.card{background:#fff;border:1px solid #e8ecf0;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}

/* Scorecards */
.scorecards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scorecard{padding:16px 18px;border-radius:12px;background:#fff;border:1px solid #e8ecf0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.scorecard .label{font-size:.73rem;color:#64748b;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.scorecard .value{font-size:1.35rem;font-weight:700;color:#1e293b;line-height:1.1}
.scorecard .value.accent{color:#4f46e5}
.scorecard .sub{font-size:.74rem;color:#94a3b8;margin-top:4px;font-family:'JetBrains Mono',monospace}
.scorecard.highlight{border-left:3px solid #4f46e5}

/* Campaign cards */
.campaigns-grid{display:grid;gap:14px}
.campaigns-grid.c2{grid-template-columns:repeat(2,1fr)}
.campaigns-grid.c3{grid-template-columns:repeat(3,1fr)}
.campaigns-grid.c4{grid-template-columns:repeat(4,1fr)}
.camp-card{padding:18px 20px;border-radius:12px;background:#fff;border:1px solid #e8ecf0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.camp-card .camp-name{font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:2px}
.camp-card .camp-tech{font-size:.7rem;color:#94a3b8;font-family:'JetBrains Mono',monospace;margin-bottom:10px}
.camp-card .camp-status{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:12px}
.camp-card .camp-status.active{background:#dcfce7;color:#15803d}
.camp-card .camp-status.paused{background:#fef9c3;color:#a16207}
.camp-card .metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.camp-card .m-item .m-label{font-size:.68rem;color:#64748b;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.camp-card .m-item .m-val{font-size:.95rem;font-weight:700;color:#1e293b}
.camp-card .m-item .m-val.green{color:#17845a}
.camp-card .m-item .m-val.muted{color:#94a3b8}

/* Ads table */
.table-filter{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.table-filter label{font-size:.82rem;font-weight:500;color:#64748b}
.table-filter select{font-family:'Poppins',sans-serif;font-size:.82rem;padding:6px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#1e293b;cursor:pointer;outline:none}
.table-filter select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #e8ecf0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;font-size:.8rem;background:#fff;border-radius:12px;overflow:hidden}
table thead tr{background:#f1f5f9}
table th{padding:10px 12px;text-align:left;font-size:.7rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
table td{padding:10px 12px;border-top:1px solid #f1f5f9;color:#1e293b;vertical-align:middle}
table tr:hover td{background:#fafbff}
table td.mono{font-family:'JetBrains Mono',monospace;font-size:.75rem}
table td.preview-cell a{color:#4f46e5;text-decoration:none;font-size:.72rem;border:1px solid #c7d2fe;padding:2px 7px;border-radius:6px;white-space:nowrap}
table td.preview-cell a:hover{background:#eef2ff}
table td.na{color:#cbd5e1;font-size:.78rem}
.roas-hi{color:#17845a;font-weight:600}
.roas-lo{color:#c0392b;font-weight:600}
.roas-mid{color:#d97706;font-weight:600}

/* Funnel */
.funnel-section{display:grid;grid-template-columns:1fr 420px;gap:24px;align-items:center}
.funnel-svg-wrap{display:flex;justify-content:center}
.funnel-legend{display:flex;flex-direction:column;gap:0}
.funnel-legend .fl-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.funnel-legend .fl-item:last-child{border-bottom:none}
.funnel-legend .fl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.funnel-legend .fl-label{font-size:.75rem;color:#64748b;font-weight:500}
.funnel-legend .fl-value{font-size:1rem;font-weight:700;color:#1e293b;margin-top:1px;font-family:'JetBrains Mono',monospace}
.funnel-legend .fl-conv{font-size:.7rem;color:#94a3b8;margin-top:1px}

/* Daily chart */
.chart-controls{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chart-controls span{font-size:.8rem;font-weight:500;color:#64748b}
.metric-btn{font-family:'Poppins',sans-serif;font-size:.78rem;font-weight:500;padding:5px 14px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;color:#64748b;cursor:pointer;transition:all .15s}
.metric-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.chart-wrap{border-radius:12px;background:#fff;border:1px solid #e8ecf0;padding:20px 20px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){
  .scorecards{grid-template-columns:repeat(2,1fr)}
  .campaigns-grid.c4,.campaigns-grid.c3{grid-template-columns:repeat(2,1fr)}
  .funnel-section{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
}
</style>

// ─── FUNNEL SVG ────────────────────────────────────────────────────────────
(function buildFunnel(){
  const svg=document.getElementById('funnelSvg');
  const cx=230, topHW=200, botHW=30, bandH=65, startY=10;
  const n=funnelStages.length;
  const step=(topHW-botHW)/(n-1);

  function hw(i){return topHW-i*step;}

  let svgContent='';
  // Draw bands (bottom to top for correct overlap)
  for(let i=0;i<n-1;i++){
    const tw=hw(i), bw=hw(i+1);
    const y0=startY+i*bandH, y1=startY+(i+1)*bandH;
    const lx0=cx-tw, rx0=cx+tw, lx1=cx-bw, rx1=cx+bw;
    svgContent+=`<path d="M${lx0},${y0} L${rx0},${y0} L${rx1},${y1} L${lx1},${y1} Z" fill="${funnelStages[i].color}" stroke="none"/>`;
    // top ellipse
    svgContent+=`<ellipse cx="${cx}" cy="${y0}" rx="${tw}" ry="7" fill="${funnelStages[i].color}" stroke="white" stroke-width="1.5"/>`;
  }
  // last ellipse bottom
  const lastHW=hw(n-1);
  const lastY=startY+(n-1)*bandH;
  svgContent+=`<ellipse cx="${cx}" cy="${lastY}" rx="${lastHW}" ry="7" fill="${funnelStages[n-1].color}" stroke="white" stroke-width="1.5"/>`;

  // Labels on the right
  for(let i=0;i<n;i++){
    const midY=i<n-1?startY+i*bandH+bandH/2:lastY;
    const maxLen=String(funnelStages[0].val).length;
    svgContent+=`<text x="${cx*2-20}" y="${midY+5}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" fill="#1e293b">${funnelStages[i].val.toLocaleString('es-AR')}</text>`;
  }

  // Conversion arrows between stages
  for(let i=1;i<n;i++){
    const y=startY+i*bandH;
    const pct=(funnelStages[i].val/funnelStages[i-1].val*100).toFixed(1);
    svgContent+=`<text x="${cx+hw(i)+8}" y="${y+4}" font-family="Poppins,sans-serif" font-size="9" fill="#94a3b8" font-weight="500">${pct.replace('.',',')}%</text>`;
  }

  svg.innerHTML=svgContent;

  // Legend
  const leg=document.getElementById('funnelLegend');
  funnelStages.forEach((s,i)=>{
    const conv=i>0?` (${(s.val/funnelStages[i-1].val*100).toFixed(1).replace('.',',')}% del paso anterior)`:'';
    leg.innerHTML+=`<div class="fl-item">
      <div class="fl-dot" style="background:${s.color}"></div>
      <div>
        <div class="fl-label">${s.name}</div>
        <div class="fl-value">${s.val.toLocaleString('es-AR')}</div>
        ${i>0?`<div class="fl-conv">${conv}</div>`:''}
      </div>
    </div>`;
  });
})();

// ─── DAILY CHART ───────────────────────────────────────────────────────────
const campColors={'3x2':'#4f46e5','2x1':'#7c3aed','ramos':'#0891b2','brand':'#0d9488'};
const campNames={'3x2':'Promo 3x2','2x1':'Promo 2x1','ramos':'CABA / Ramos','brand':'Brand Awareness'};
let currentMetric='spend';
let chartInst=null;

function getDatasets(metric){
  const src=metric==='spend'?dailySpend:metric==='purchases'?dailyPurchases:dailyROAS;
  return Object.keys(src).map(k=>({
    label:campNames[k],
    data:src[k],
    borderColor:campColors[k],
    backgroundColor:campColors[k]+'22',
    borderWidth:2.5,
    pointRadius:4,
    pointHoverRadius:6,
    tension:.35,
    spanGaps:true,
    fill:false,
  }));
}

function buildChart(){
  const ctx=document.getElementById('dailyChart').getContext('2d');
  if(chartInst)chartInst.destroy();
  const yLabel=currentMetric==='spend'?'Inversión (ARS)':currentMetric==='purchases'?'Compras':'ROAS';
  chartInst=new Chart(ctx,{
    type:'line',
    data:{labels:days,datasets:getDatasets(currentMetric)},
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top',labels:{font:{family:'Poppins',size:11},usePointStyle:true,pointStyleWidth:8}},
        tooltip:{
          backgroundColor:'#fff',borderColor:'#e2e8f0',borderWidth:1,
          titleColor:'#1e293b',bodyColor:'#64748b',
          callbacks:{
            label:(ctx)=>{
              const v=ctx.raw;
              if(v===null||v===undefined)return null;
              const n=ctx.dataset.label+': ';
              if(currentMetric==='spend')return n+'$'+Math.round(v).toLocaleString('es-AR')+' ARS';
              if(currentMetric==='roas')return n+v.toFixed(2).replace('.',',')+' x';
              return n+v;
            }
          }
        }
      },
      scales:{
        x:{grid:{color:'#f1f5f9'},ticks:{font:{family:'Poppins',size:10},color:'#94a3b8'}},
        y:{grid:{color:'#f1f5f9'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#94a3b8',
          callback:(v)=>{
            if(currentMetric==='spend')return '$'+Math.round(v/1000)+'k';
            if(currentMetric==='roas')return v.toFixed(1)+'x';
            return v;
          }
        },beginAtZero:true},
      }
    }
  });
}

function switchMetric(m,btn){
  currentMetric=m;
  document.querySelectorAll('.metric-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildChart();
}

window.addEventListener('load',buildChart);
